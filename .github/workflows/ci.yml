name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `next build`/tsc/lint/unit-tests never query the database (every route is server-rendered on
# demand, nothing is statically generated from Prisma data at build time) — Prisma's client
# generator only reads the schema file. The e2e job below is the exception: it needs a real,
# working Postgres to seed and run real Server Actions against, hence the service container.
env:
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_placeholder"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vocabapp
          POSTGRES_PASSWORD: vocabapp
          POSTGRES_DB: vocabapp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://vocabapp:vocabapp@localhost:5432/vocabapp_e2e"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Migrate + seed the e2e database
        run: |
          npx prisma migrate deploy
          npx prisma db seed
          npm run test:e2e:seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
